name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Tests
        run: pytest -q
      - name: Bandit
        run: bandit -r app
      - name: Dependency audit
        run: pip-audit
      - name: Build Python distributions
        run: python -m build
      - name: Verify wheel contains runtime assets
        run: |
          python - <<'PY'
          import glob
          import zipfile

          wheel = glob.glob("dist/*.whl")[0]
          with zipfile.ZipFile(wheel) as archive:
              names = set(archive.namelist())

          required = {
              "app/assessment/questions.json",
              "app/templates/base.html",
              "app/templates/index.html",
              "app/templates/module_placeholder.html",
              "app/templates/openscan.html",
              "app/templates/openscan_result.html",
              "app/templates/assessment.html",
              "app/templates/result.html",
              "app/static/app.css",
              "app/static/app.js",
              "app/static/istanbul-hero.svg",
          }
          missing = sorted(required - names)
          if missing:
              raise SystemExit(f"Wheel is missing runtime assets: {missing}")
          print(f"Verified runtime assets in {wheel}")
          PY
      - name: Smoke test installed wheel
        run: |
          python -m venv /tmp/siberkobi-wheel
          /tmp/siberkobi-wheel/bin/python -m pip install --upgrade pip
          /tmp/siberkobi-wheel/bin/pip install dist/*.whl
          /tmp/siberkobi-wheel/bin/python - <<'PY'
          from app import create_app

          client = create_app().test_client()
          response = client.get("/health")
          assert response.status_code == 200
          assert response.get_json() == {"status": "ok"}

          response = client.get("/")
          assert response.status_code == 200
          body = response.get_data(as_text=True)
          assert "Web Analiz" in body
          assert "SEO Analiz" in body

          response = client.get("/openscan")
          assert response.status_code == 200
          assert 'name="target"' in response.get_data(as_text=True)

          response = client.get("/assessment")
          assert response.status_code == 200
          body = response.get_data(as_text=True)
          assert "SK-T01" in body
          assert "SK-T25" in body
          print("Installed wheel smoke test passed")
          PY

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build container image
        run: docker build --tag siberkobi:test .
      - name: Run container
        run: docker run --detach --name siberkobi-ci -p 8000:8000 siberkobi:test
      - name: Verify container health endpoint
        run: |
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8000/health > /tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 1
          done
          docker logs siberkobi-ci
          exit 1
      - name: Verify landing and assessment pages
        run: |
          curl --fail --silent http://127.0.0.1:8000/ | grep -q "Web Analiz"
          curl --fail --silent http://127.0.0.1:8000/ | grep -q "SEO Analiz"
          curl --fail --silent http://127.0.0.1:8000/openscan | grep -q 'name="target"'
          curl --fail --silent http://127.0.0.1:8000/assessment | grep -q "SK-T01"
          curl --fail --silent http://127.0.0.1:8000/assessment | grep -q "SK-T25"
      - name: Stop container
        if: always()
        run: docker rm --force siberkobi-ci || true
