[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "siberkobi"
version = "0.1.0"
description = "Open-source cybersecurity self-assessment for SMEs"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
  "Flask>=3.1,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10",
  "ruff>=0.8,<1",
  "bandit>=1.7,<2",
  "pip-audit>=2.7,<3",
  "build>=1.3,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = [
  "assessment/*.json",
  "templates/*.html",
  "static/*.css",
  "static/*.js",
]
