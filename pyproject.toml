[project]
name = "siberkobi"
version = "0.1.0"
description = "Open-source cybersecurity self-assessment for SMEs"
requires-python = ">=3.13"
dependencies = [
  "Flask>=3.1,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.8,<1",
  "bandit>=1.7,<2",
  "pip-audit>=2.7,<3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
