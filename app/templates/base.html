<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SiberKOBİ{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="{{ url_for('web.index') }}">SiberKOBİ</a>
      <span class="brand-note">Eclipta</span>
    </div>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <footer class="container footer">
    <p>SiberKOBİ · Açık kaynak siber güvenlik öz değerlendirme aracı</p>
  </footer>
</body>
</html>
