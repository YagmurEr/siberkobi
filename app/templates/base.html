<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SiberKOBİ{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
  <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="{{ url_for('web.index') }}">SiberKOBİ</a>
      <nav class="main-nav" aria-label="Ana menü">
        <a href="{{ url_for('web.assessment') }}">Öz Değerlendirme</a>
        <a href="{{ url_for('web.openscan') }}">OpenScan</a>
        <a href="{{ url_for('web.web_seo_audit') }}">Web & SEO Audit</a>
      </nav>
      <span class="brand-note">Eclipta</span>
    </div>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <footer class="container footer">
    <p>SiberKOBİ · Açık kaynak siber güvenlik ve web değerlendirme araçları</p>
  </footer>
</body>
</html>
